version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build chatto-tidal-bot binary
    cmds:
      - go build -o chatto-tidal-bot .

  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...

  test:
    desc: Run tests (auto fallback to no-CGO mode if native audio deps are missing)
    cmds:
      - |
        if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists soxr opusfile; then
          go test . ./bot ./chatto ./tidal ./livekit
        else
          CGO_ENABLED=0 go test . ./bot ./chatto ./tidal ./livekit
        fi

  test:nocgo:
    desc: Run tests without CGO/native audio dependencies
    cmds:
      - CGO_ENABLED=0 go test . ./bot ./chatto ./tidal ./livekit
